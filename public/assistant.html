<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src ipc: http://ipc.localhost; base-uri 'none'; form-action 'none'"><title>Слой · помощник</title><style>/* DESK_CSS */
.live-shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.live-nav{padding:28px 16px;background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:20px}.live-nav a{text-decoration:none}.live-projects{display:grid;gap:7px;flex:1;align-content:start}.nav-task{text-align:left;padding:12px;border-radius:10px}.nav-task.active,.live-tabs .active{background:var(--tint);color:var(--accent)}.live-main{padding:30px 42px;max-width:1650px;min-width:0}.live-top{display:flex;justify-content:space-between;align-items:center}.live-top h1{font-size:28px;letter-spacing:-.025em;margin:8px 0 20px}.live-tabs{display:flex;gap:10px;margin-bottom:24px;border-bottom:1px solid var(--line);padding-bottom:10px}.live-tabs button{padding:9px 14px;border-radius:8px}.live-grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}.live-main .panel{margin-bottom:18px}.live-main label{display:block;margin:16px 0 10px}.live-main input:not([type=checkbox]),.live-main textarea{display:block;width:100%;border:1px solid var(--line);background:var(--bg);padding:12px;border-radius:9px;margin-top:8px;resize:vertical}.preserve,pre{white-space:pre-wrap;overflow-wrap:anywhere}.path{overflow-wrap:anywhere}.live-answer{border-top:1px solid var(--line);padding:18px 0}.live-answer small{color:var(--muted)}.live-answer pre{font-family:inherit}.live-consent{display:flex!important;gap:12px;align-items:flex-start;max-width:780px}.live-consent input{margin-top:5px}.live-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:24px 0}.live-metrics div{padding:16px;border:1px solid var(--line);border-radius:10px}.live-metrics strong{display:block;font-size:25px}.live-metrics span{color:var(--muted);font-size:12px}.live-table{overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--line);max-width:400px;overflow-wrap:anywhere}.live-main small{display:block}.event{display:block!important}.muted{color:var(--muted)}
.research-hypotheses{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.research-hypotheses article,.research-probe{border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.research-meta{color:var(--muted);font-size:12px}.research-probe details{margin:12px 0}.research-probe summary{cursor:pointer}.research-probe pre{padding:12px;border-radius:8px;background:var(--bg);max-height:260px;overflow:auto;font-size:13px}.research-hypotheses h3,.research-probe h3{margin:8px 0}
.live-main select{display:block;width:100%;min-width:0;border:1px solid var(--line);background:var(--bg);padding:10px;border-radius:9px;margin-top:8px}.live-main details>summary{cursor:pointer}.continuation-data{max-height:260px;overflow:auto;font-size:12px;background:var(--bg);padding:12px;border-radius:8px}

@media(max-width:700px){.live-shell{grid-template-columns:1fr}.live-nav{position:static;gap:12px}.live-projects{display:none}.live-tabs{overflow:auto}.live-grid>aside{display:block}.live-metrics{grid-template-columns:repeat(2,1fr)}}
