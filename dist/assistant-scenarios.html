if(name==='switch'){title='Смена исполнителя — без потери работы';body=`<p>Цель, ограничения, версии источников и открытые замечания переносятся явно. Скрытое состояние модели не объявляется переносимым.</p><label class="field">Новый исполнитель<select id="next-model"><option>Codex · новая сессия</option><option>Другой допустимый агент</option></select></label><div class="notice amber" style="margin-top:18px">${['running','cancel_requested','unknown'].includes(s.status)?'Активная работа не подменяется на лету. Сначала остановка или сверка; переключение останется запланированным.':'Контекст ещё не передан. Нужно разрешение на конкретного получателя.'}</div><label class="toggle-label"><input id="allow-transfer" type="checkbox">Разрешить сценарную передачу указанного пакета</label>`;foot=btn('plan-switch','Запланировать замену')+btn('confirm-switch','Подтвердить после остановки','primary');}

if(name==='observer-help'){title='Сборщик: только чтение Codex';body='<p>В распакованном пакете откройте PowerShell 7 и выполните:</p><pre class="mono">.\\tools\\Collect-Codex.ps1 -Watch</pre><p>Сборщик читает rollout-*.jsonl из sessions и archived_sessions вашего CODEX_HOME. Создаёт capture.json и Report.html. Откройте Report.html вручную. Ctrl+C останавливает сборщик.</p><p>Он не запускает Codex, не меняет config.toml, не читает auth.json и не отправляет данные. Снимок обновляется при изменении журналов, а не по платному модельному опросу.</p><div class="notice amber">PowerShell-скрипт написан, но не исполнялся на этом стенде. Движок анализа отдельно проверяется CLI-тестами. Импорт исходного JSONL работает и без скрипта.</div>';}
if(name==='about'){title='Три разных уровня готовности';body='<div class="capabilities"><div class="capability"><span>Экраны и конфликтные переходы</span><span>интерактивный макет</span></div><div class="capability"><span>Разбор выбранных журналов</span><span>реальный локальный код</span></div><div class="capability"><span>Живой агент / запись файлов</span><span>не подключены</span></div></div><p>Автосохранение черновика, редактирование поручения, экспорт задания и анализ JSONL выполняются локально. Поведение агента в сценариях не считается его испытанием.</p><p>Нет сети, сервера, ключей, вызовов модели или скрытого управления вашим компьютером.</p>';}
if(name==='adapter-details'){title='Минимальная служба, не универсальный бэкенд';body='<p>Адаптер получает явные команды и отдаёт события. Он не решает, чего хочет человек.</p><div class="capabilities"><div class="capability"><span>Сессии</span><span>list / read / start / resume</span></div><div class="capability"><span>Ход</span><span>start / steer / interrupt</span></div><div class="capability"><span>Наблюдение</span><span>events + usage + coverage</span></div><div class="capability"><span>Проект</span><span>snapshot / diff / proposal</span></div><div class="capability"><span>Полномочия</span><span>разрешённые CLI/API/файлы</span></div></div><p>Существующий Codex может быть первым harness. Настройки sandbox не заменяются на bypass. Подключение к отдельной существующей беседе требует проверки её доступности и владения сессией.</p>';}
if(name==='project'){title='Контекст проекта';body='<p>Platform Studio — название сценарного проекта, не привязка к вашей папке. В этой поставке реальные файлы читаются только через явный выбор журналов.</p><p>Целевая реализация хранит project ID отдельно от пути. Новый проект не получает автоматически доступ к данным прежнего.</p>';}
$('overlay').innerHTML=`<div class="dialog-shade"><section class="dialog ${narrow?'narrow':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title">${title}</h2><button class="iconbtn" data-action="close" aria-label="Закрыть">${icon('close')}</button></div>${body}${foot?'<div class="toolbar">'+foot+'</div>':''}</section></div>`;
$('overlay').querySelector('button,input,textarea,select')?.focus();}
function closeDialog(){modal='';$('overlay').innerHTML='';modalReturn?.focus?.();}
function exampleTelemetry(){const rows=[],base=Date.parse('2026-11-09T09:00:00Z'),stamp=n=>new Date(base+n).toISOString(),emit=(n,type,payload)=>rows.push({timestamp:stamp(n),type,payload});
emit(0,'session_meta',{id:'example-session',cli_version:'example',source:'fixture'});emit(0,'turn_context',{turn_id:'example-turn',model:'сценарная модель'});emit(0,'event_msg',{type:'task_started',turn_id:'example-turn'});emit(0,'event_msg',{type:'token_count',info:{total_token_usage:{input_tokens:0,cached_input_tokens:0,output_tokens:0,reasoning_output_tokens:0,total_tokens:0}}});emit(2000,'event_msg',{type:'exec_command_begin',call_id:'c1',turn_id:'example-turn'});emit(6500,'event_msg',{type:'exec_command_end',call_id:'c1',turn_id:'example-turn',exit_code:0});emit(11000,'event_msg',{type:'agent_message',turn_id:'example-turn'});emit(12000,'token_usage_record',{thread_id:'example-session',turn_id:'example-turn',response_id:'example-r1',usage:{input_tokens:12400,cached_input_tokens:9200,output_tokens:1840,reasoning_output_tokens:800,total_tokens:14240}});emit(12000,'event_msg',{type:'token_count',info:{total_token_usage:{input_tokens:12400,cached_input_tokens:9200,output_tokens:1840,reasoning_output_tokens:800,total_tokens:14240}}});emit(12500,'event_msg',{type:'task_complete',turn_id:'example-turn'});
telemetry=T.analyze(rows.map((r,i)=>T.normalize(r,'example',i)));telemetrySource='sample';captureAt=null;screen='observe';selectedSession=0;render();}
document.addEventListener('click',async event=>{
const nav=event.target.closest('[data-screen]');if(nav){screen=nav.dataset.screen;render();window.scrollTo(0,0);return;}
const n=event.target.closest('[data-node]');if(n){selectedNode=n.dataset.node;render();return;}
const b=event.target.closest('[data-action]');if(!b||b.disabled)return;
const a=b.dataset.action;
if(['scenarios','merge','switch','new-task','about','observer-help','adapter-details','project'].includes(a)){openDialog(a);return;}
if(a==='close'){closeDialog();return;}
if(a==='theme'){document.documentElement.classList.toggle('light');return;}
if(a.startsWith('view-')){screen=({prompt:'prompt',changes:'changes',connections:'connections',team:'team'})[a.slice(5)]||'task';render();return;}
if(a==='load-scenario'){preserveWork();s=C.makeState(b.dataset.id);draft='';draftsByScope={};editorDrafts={original:null,english:null};closeDialog();screen=['conflict','review-failed','goal-changed'].includes(s.scenario)?'changes':s.scenario==='draft-conflict'?'prompt':'task';persist();render();return;}
if(a==='steer'){const key=scopeKey();const text=$('composer')?.value||draftsByScope[key]||'';if(!text.trim()){notify('Напишите уточнение.');return;}dispatch('STEER',{text:screen==='changes'?`[${fileNames[selectedFile]} @ ${s.resultVersion}] ${text}`:text});delete draftsByScope[key];draft='';persist();render();return;}
const simple={start:'START',complete:'COMPLETE',cancel:'CANCEL',stopped:'STOP_OBSERVED',reconcile:'RECONCILE',retry:'RETRY',continue:'CONTINUE',accept:'ACCEPT',recheck:'RECHECK',fix:'REQUEST_FIX','keep-local':'KEEP_LOCAL_PROMPT'};
if(simple[a]){dispatch(simple[a]);return;}
if(a==='edit-goal'){screen='prompt';render();$('original-editor')?.focus();return;}
if(a==='save-goal'){const text=$('original-editor').value;editorDrafts.original=null;dispatch('EDIT_GOAL',{text});return;}
if(a==='save-prompt'){const text=$('english-editor').value;editorDrafts.english=null;dispatch('SAVE_PROMPT',{text,expectedRevision:s.expectedPromptRevision});return;}
if(a==='load-prompt-version'){const v=Number($('prompt-version').value);const old=s.promptHistory.find(x=>x.revision===v);if(old){editorDrafts.english=old.text;persist();render();notify('Прежняя версия открыта как черновик. Сохранение создаст новую редакцию.');}return;}
if(a==='copy-prompt'){const text=$('english-editor').value;try{await navigator.clipboard.writeText(text);notify('Скопирован текущий текст поручения.');}catch{$('english-editor').select();notify('Буфер обмена недоступен. Текст выделен: Ctrl+C.');}return;}
if(a==='restore-work'){const old=savedWorks.shift();if(old){const current={state:s,drafts:draftsByScope,editors:editorDrafts};s=old.state;draftsByScope=old.drafts;editorDrafts=old.editors;savedWorks.push(current);persist();render();}return;}
if(a==='export'){download('assistant-task.json',JSON.stringify({...C.buildHandoff(s),localDrafts:{...editorDrafts,comments:draftsByScope}},null,2));return;}
if(a==='create-task'){const text=$('new-request').value,title=$('new-title').value;if(!text.trim()){notify('Опишите нужный результат.');return;}preserveWork();closeDialog();s=C.makeState('disconnected');draftsByScope={};editorDrafts={original:null,english:null};dispatch('LOCAL_DRAFT',{text,title});screen='task';render();return;}
if(a==='select-file'){selectedFile=Number(b.dataset.index);render();return;}
if(a==='merge-ours'||a==='merge-both'){closeDialog();dispatch('MERGE',{choice:a==='merge-ours'?'ours':'merged'});return;}
if(a==='plan-switch'){const model=$('next-model').value;closeDialog();dispatch('SWITCH_REQUEST',{model});return;}
if(a==='confirm-switch'){const allowTransfer=$('allow-transfer').checked,model=$('next-model').value;closeDialog();s=C.reduce(s,{type:'SWITCH_REQUEST',model}).state;dispatch('SWITCH_CONFIRM',{allowTransfer});return;}
if(a==='sheet'){sheet=b.dataset.sheet;render();return;}
if(a==='save-node'){const node=roleNodes.find(x=>x.id===selectedNode);node.label=$('node-label').value.slice(0,100);node.desc=$('node-desc').value.slice(0,500);persist();render();return;}
if(a==='add-note'){const id='note-'+Date.now();roleNodes.push({id,label:'Новый шаг',type:'Сценарный шаг',desc:'Уточните назначение справа',x:70,y:350});selectedNode=id;persist();render();return;}
if(a==='import'){$('import-log').click();return;}
if(a==='sample-metrics'){exampleTelemetry();return;}
if(a==='export-metrics'&&telemetry){download('codex-metrics.json',JSON.stringify(telemetry,null,2));return;}
notify('Для этого действия ещё нет реализации. Никакой внешний эффект не выполнен.');
});
document.addEventListener('input',e=>{if(e.target.id==='composer'){draft=e.target.value;draftsByScope[scopeKey()]=draft;}else if(e.target.id==='original-editor'){editorDrafts.original=e.target.value;}else if(e.target.id==='english-editor'){editorDrafts.english=e.target.value;}else return;clearTimeout(persist.timer);persist.timer=setTimeout(persist,500);});
document.addEventListener('change',e=>{if(e.target.id==='session-select'){selectedSession=Number(e.target.value);render();}});
document.addEventListener('keydown',e=>{
if(e.key==='Escape'&&modal){closeDialog();return;}
if(modal&&e.key==='Tab'){const els=[...$('overlay').querySelectorAll('button,input,textarea,select,a')].filter(x=>!x.disabled);if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}
if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&e.target.id==='composer'){e.preventDefault();document.querySelector('[data-action="steer"]').click();}
const n=e.target.closest?.('[data-node]');if(n&&['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();const obj=roleNodes.find(x=>x.id===n.dataset.node);obj.x=Math.max(0,obj.x+(e.key==='ArrowRight'?10:e.key==='ArrowLeft'?-10:0));obj.y=Math.max(0,obj.y+(e.key==='ArrowDown'?10:e.key==='ArrowUp'?-10:0));persist();const id=obj.id;render();document.querySelector(`[data-node="${id}"]`)?.focus();}
});
let dragging=null;
document.addEventListener('pointerdown',e=>{const node=e.target.closest('[data-node]');if(!node||sheet!=='main')return;const obj=roleNodes.find(n=>n.id===node.dataset.node);dragging={id:obj.id,startX:e.clientX,startY:e.clientY,x:obj.x,y:obj.y,node,moved:false};node.setPointerCapture?.(e.pointerId);});
document.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-dragging.startX,dy=e.clientY-dragging.startY;if(Math.abs(dx)+Math.abs(dy)>4)dragging.moved=true;if(!dragging.moved)return;const n=roleNodes.find(x=>x.id===dragging.id);n.x=Math.min(790,Math.max(0,dragging.x+dx));n.y=Math.min(410,Math.max(0,dragging.y+dy));dragging.node.style.left=n.x+'px';dragging.node.style.top=n.y+'px';});
document.addEventListener('pointerup',()=>{const moved=dragging?.moved;dragging=null;if(moved){persist();render();}});
$('import-log').addEventListener('change',async e=>{const files=[...e.target.files];if(!files.length)return;const max=64*1024*1024;if(files.some(f=>f.size>max)||files.reduce((a,f)=>a+f.size,0)>max*2){notify('Предел импорта: 64 МиБ на файл и 128 МиБ суммарно. Выберите меньшую выборку.');e.target.value='';return;}let events=[],warnings=[];try{for(let i=0;i<files.length;i++){const parsed=T.parseText(await files[i].text(),'import-'+i);events.push(...parsed.events);warnings.push(...parsed.warnings);if(events.length>200000)throw new Error('Выборка превышает 200 000 событий. Разделите журналы.');}telemetry=T.analyze(events,warnings);telemetrySource='real';selectedSession=0;captureAt=null;screen='observe';render();notify('Файлы разобраны локально. Запросов к Codex не было.');}catch(err){notify('Импорт остановлен: '+err.message);}e.target.value='';});
render();
})();
</script></body></html>
