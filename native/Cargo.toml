[workspace]
members = ["crates/core", "crates/host", "crates/desktop"]
default-members = ["crates/core", "crates/host"]
resolver = "3"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "=0.41.1", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "debuginfo"
