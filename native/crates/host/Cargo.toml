[package]
name = "studio-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[lib]
name = "studio_host"
path = "src/lib.rs"
[[bin]]
name = "studio-host"
path = "src/main.rs"
[dependencies]
studio-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_System_IO"] }
